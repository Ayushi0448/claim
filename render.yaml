# Render blueprint: https://render.com/docs/blueprint-spec
# Deploy with: New > Blueprint > point at this repository.
services:
  - type: web
    name: aptino-claim-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8000
      - key: CORS_ORIGINS
        # Replace with your Streamlit app origin once deployed.
        value: "*"
      - key: EMBEDDING_BACKEND
        # Pinned to the offline backend: the free tier has 512 MB RAM, which is
        # not enough to hold transformer weights alongside the service.
        value: lsa
      - key: RERANKER_BACKEND
        value: lexical
      - key: LLM_PROVIDER
        value: none
      # To enable the optional LLM layer, add LLM_API_KEY as a secret in the
      # Render dashboard. Never put a key in this file.
      - key: LLM_API_KEY
        sync: false
